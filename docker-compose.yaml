services:
  the_car:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8888:8888"
      - "31337:31337"
    volumes:
      - carhack-data:/app/stores
    environment:
      FLAG_RETENTION_SECONDS: ${FLAG_RETENTION_SECONDS:-3600}
      TEAM_ID: ${TEAM_ID:?set the team identity generated for this service}
      CHECKER_PUBKEY: ${CHECKER_PUBKEY:?set this team public key from generate_keys.py}
      TELE_KEY: ${TELE_KEY:-}
      JWT_RSA_PRIV: ${JWT_RSA_PRIV:-}
      JWT_RSA_PUB: ${JWT_RSA_PUB:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  carhack-data:
